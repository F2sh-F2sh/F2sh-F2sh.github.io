<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Projections</title>

  <style>
    body {
      background-image: url("PB.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      color: #FBF2E0;
    }

    nav {
      display: flex;
      gap: 10px;
      padding: 15px 30px;
      background-color: rgba(0, 0, 0, 0.2);
    }

    nav a {
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 6px;
    }

    nav a:hover,
    nav a.active {
      background-color: #E3A32C;
    }

    main {
      width: 100%;
      max-width: none;
      box-sizing: border-box;
      padding: 30px 60px;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: minmax(0, 560px);
      justify-content: start;
      gap: 40px;
      width: 100%;
    }

    .project-card {
      width: 100%;
      box-sizing: border-box;
      overflow: hidden;
      background: rgba(22, 20, 18, 0.9);
      border: 2px solid rgba(251, 242, 224, 0.72);
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.34);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .project-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.42);
    }

    .project-gallery {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #111;
    }

    .gallery-image {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .gallery-image.active {
      display: block;
    }

    .gallery-button {
      position: absolute;
      top: 50%;
      width: 32px;
      height: 32px;
      padding: 0;
      transform: translateY(-50%);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.58);
      color: white;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    .gallery-button:hover,
    .gallery-button:focus-visible {
      background: #E3A32C;
    }

    .gallery-button.previous {
      left: 10px;
    }

    .gallery-button.next {
      right: 10px;
    }

    .gallery-count {
      position: absolute;
      right: 10px;
      bottom: 10px;
      padding: 4px 8px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.65);
      font-size: 12px;
    }

    .project-details {
      padding: 20px 22px 22px;
    }

    .project-card h2 {
      margin: 0 0 8px;
      color: #E3A32C;
    }

    .project-card p {
      margin: 0;
      line-height: 1.5;
      color: #FBF2E0;
    }

    @media (max-width: 700px) {
      main {
        padding: 22px 16px;
      }

      nav {
        flex-wrap: wrap;
        padding: 12px 16px;
      }
    }
    
  </style>
</head>

<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="hedgy.html">Hedgy Lore</a>
    <a href="game.html">Game</a>
    <a class="active" href="projects.html">Projects</a>
  </nav>

  <marquee scrollamount="16"><h1><span>The many projects I have created</span></h1></marquee>
  
  <main>

    <div class="projects-grid">

      <article class="project-card">
        <div class="project-gallery" aria-label="Sandevistan project photos">
          <img class="gallery-image active" src="assets/projects/sandevistan/IMG_0528.jpeg" alt="Completed Sandevistan costume glowing green while being worn">
          <img class="gallery-image" src="assets/projects/sandevistan/IMG_0525.jpeg" alt="Sandevistan model with its green lights switched on">
          <img class="gallery-image" src="assets/projects/sandevistan/F3AB383F-470F-461F-8691-DCC5BC21E8A7.jpeg" alt="Assembled Sandevistan model held upright">
          <img class="gallery-image" src="assets/projects/sandevistan/IMG_0508.jpeg" alt="Early assembled Sandevistan prototype">
          <img class="gallery-image" src="assets/projects/sandevistan/IMG_0524.jpeg" alt="Painted Sandevistan sections laid out before final assembly">
          <img class="gallery-image" src="assets/projects/sandevistan/IMG_9933.jpeg" alt="Sandevistan printed parts and connector pieces">
          <img class="gallery-image" src="assets/projects/sandevistan/IMG_9836.jpeg" alt="Small 3D-printed connector components">
          <button class="gallery-button previous" type="button" aria-label="Previous photo">&#8249;</button>
          <button class="gallery-button next" type="button" aria-label="Next photo">&#8250;</button>
          <span class="gallery-count" aria-live="polite">1 / 7</span>
        </div>
        <div class="project-details">
          <h2>The Sandevistan</h2>
          <p>Modeled after the Cyberpunk: Edgerunners cybernetic upgrade found by the main character, David Martinez. The 3D model lights up to simulate the show.</p>
        </div>
      </article>

    </div>
  </main>

  <script>
    const gallery = document.querySelector('.project-gallery');
    const images = [...gallery.querySelectorAll('.gallery-image')];
    const count = gallery.querySelector('.gallery-count');
    let currentImage = 0;

    function showImage(index) {
      images[currentImage].classList.remove('active');
      currentImage = (index + images.length) % images.length;
      images[currentImage].classList.add('active');
      count.textContent = `${currentImage + 1} / ${images.length}`;
    }

    gallery.querySelector('.previous').addEventListener('click', () => showImage(currentImage - 1));
    gallery.querySelector('.next').addEventListener('click', () => showImage(currentImage + 1));
  </script>
</body>
</html>
